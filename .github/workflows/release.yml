name: Android Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - name: Install mobile dependencies
        run: npm ci
        working-directory: apps/mobile
      - name: Build APK with EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          cd apps/mobile
          npx eas-cli@latest build --platform android --profile preview --non-interactive --wait --json > eas-build.json
          node <<'NODE'
          const fs = require("fs");
          const data = JSON.parse(fs.readFileSync("eas-build.json", "utf8"));
          const build = Array.isArray(data) ? data[0] : data;
          if (!build || build.status !== "FINISHED") {
            const message = build?.error?.message ?? "EAS build did not finish successfully";
            throw new Error(message);
          }
          const url = build.artifacts?.buildUrl ?? build.artifacts?.applicationArchiveUrl ?? build.artifactUrl;
          if (!url) throw new Error("EAS did not return an APK URL");
          fs.writeFileSync("apk-url.txt", url);
          NODE
          curl -L "$(cat apk-url.txt)" -o ../../ilot-android.apk
          sha256sum ../../ilot-android.apk | tee ../../ilot-android.apk.sha256
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Îlot ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            ilot-android.apk
            ilot-android.apk.sha256
